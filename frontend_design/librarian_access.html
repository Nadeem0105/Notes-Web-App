<style>

            background-color: #E6D5AC; /* Manila desk surface */
        }

            background-color: #F3E5AB; /* Lighter active card */
            border: 1px solid #D4C49A;
            box-shadow: 2px 2px 0px 0px rgba(45,45,45,0.1);
            background-image: repeating-linear-gradient(transparent, transparent 23px, #E6D5AC 23px, #E6D5AC 24px);
            background-position: top 48px left 0; /* Start ruling lines below header */
        }
        .input-ledger {
            background: transparent;
            border: none;
            border-bottom: 2px solid #D4C49A;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }
        .input-ledger:focus {
            outline: none;
            box-shadow: none;

        }
        .stamp-button {
            border: 2px solid #685e31;
            border-radius: 0;

            color: #ffffff;

<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-desktop w-full h-16 z-50 transition-colors duration-200">
<div class="flex items-center gap-4">
<span class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">Archival Catalog</span>
</div>
<div class="flex items-center gap-4 hidden md:flex">
<!-- Suppressed Nav Shell for Linear Intent (Login) -->
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-container-high p-2 rounded-DEFAULT transition-colors duration-200" data-icon="settings">settings</span>
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-container-high p-2 rounded-DEFAULT transition-colors duration-200" data-icon="help">help</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-gutter md:p-margin-desktop">
<!-- Login Index Card -->
<div class="index-card w-full max-w-md p-card-padding relative group transition-transform duration-300 hover:-translate-y-1">
<!-- Edge Stripe -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<!-- Paperclip Decoration -->
<img alt="Vintage paperclip" class="absolute -top-4 -right-2 w-12 h-12 object-contain rotate-12 drop-shadow-sm pointer-events-none" src="https://lh3.googleusercontent.com/aida/AP1WRLtFF8KcOtUyV_uqSyD6nGHGp_Ja-xCPcaPNlLQF-lhLg92h5CcD2tYAjBMfyu9ptdN2BfepeMty34I5tajIhrrkfGn8ZTgUAzTGUkhLaMC2hm8-TCCpjCF2HBRsj6h2dNFaDKU1OPt_hryNxh3bRgwJYZp8koFQpd9VQMyPoOOd1VWGWED2uIeM4XIf12rjX6KRUlJOl6iSoPYWm1-AAX0ktbC0Uak9fr_5JAl_fxWhzvpztY9amfLOneg"/>
<div class="flex flex-col items-center mb-8 relative z-10">
<img alt="Archival Catalog Stamp Logo" class="w-16 h-16 mb-4 rounded-sm object-cover border border-outline-variant" src="https://lh3.googleusercontent.com/aida/AP1WRLuuHQE2UzTSWyKqdqm1DltCG0VdIGiuqlFi-mf5kU37tS1-GqJOJ8qDtu-v7fgp3SrawAnphLICWju9B4wVH5iF0MIO8vVNEiWr_JwqgWC8AqoORfvRX2fx7Y4LG1QJkcAXf41eojdHoPpYYUN0Rx5ygtSWTcCIvrP7NUlN1QlTgYT6rSgkzNfJ9WIk7dujtcv-2KxhnDI-ky54KHsVQf0nVlSQ3SrKMjP9qdk-gLutJvFH2r5qmb1cgnU"/>
<h1 class="font-headline-lg text-headline-lg text-on-surface text-center bg-[#F3E5AB] px-2 py-1">Librarian Access</h1>
<p class="font-label-md text-label-md text-on-surface-variant mt-2 bg-[#F3E5AB] px-2">System Entry Log</p>
</div>
<form class="space-y-6 relative z-10">
<div class="flex flex-col bg-[#F3E5AB]">
<label class="font-label-md text-label-md text-on-surface-variant mb-1" for="librarian_id">LIBRARIAN ID NO.</label>
<input class="input-ledger font-label-md text-label-md text-on-surface w-full h-8" id="librarian_id" placeholder="Enter ID..." type="text"/>
</div>
<div class="flex flex-col bg-[#F3E5AB]">
<label class="font-label-md text-label-md text-on-surface-variant mb-1" for="access_key">ACCESS KEY (CYPHER)</label>
<input class="input-ledger font-label-md text-label-md text-on-surface w-full h-8" id="access_key" placeholder="Enter Key..." type="password"/>
</div>
<div class="pt-6 flex justify-center bg-[#F3E5AB]">
<button class="stamp-button w-full py-3 font-headline-sm text-headline-sm text-primary transition-colors duration-200 flex items-center justify-center gap-2" type="button">
<span>Grant Access</span>
<span class="material-symbols-outlined" data-icon="fingerprint">fingerprint</span>
</button>
</div>
</form>
<div class="mt-8 text-center bg-[#F3E5AB] py-1">
<a class="font-label-md text-label-md text-primary underline hover:text-on-surface transition-colors" href="#">Request Catalog Access</a>
</div>
</div>

<!-- Footer -->

<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer" href="#">System Status</a>
</div>
</footer>
